<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="referrer" content="no-referrer">

  <!--
    Defense-in-depth for static hosts such as GitHub Pages.
    Stronger response-header examples for later self-hosting are in /hosting.
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests"
  >

  <title>Clock + Stopwatch</title>
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="app" aria-label="Clock and stopwatch">
    <section class="panel" aria-labelledby="clock-heading">
      <div class="panel-inner">
        <div class="eyebrow" id="clock-heading">Clock</div>
        <div class="clock-time" aria-live="off" aria-atomic="true">
          <span id="clockMain">--:--</span><span class="clock-seconds" id="clockSeconds"></span><span class="clock-period" id="clockPeriod"></span>
        </div>
        <div class="date" id="dateText">Loading date…</div>
      </div>
    </section>

    <section class="panel" aria-labelledby="stopwatch-heading">
      <div class="panel-inner">
        <div class="eyebrow" id="stopwatch-heading">Stopwatch</div>
        <div class="stopwatch-time" aria-live="off" aria-atomic="true">
          <span id="stopwatchMain">00:00</span><span class="stopwatch-ms" id="stopwatchFraction">.00</span>
        </div>

        <div class="controls">
          <button class="btn primary" id="startPauseBtn" type="button">Start</button>
          <button class="btn" id="lapBtn" type="button" disabled>Lap</button>
          <button class="btn danger" id="resetBtn" type="button" disabled>Reset</button>
        </div>

        <div class="laps" id="laps" aria-label="Lap times">
          <div class="empty-laps" id="emptyLaps">Lap times will appear here.</div>
        </div>
      </div>
    </section>

    <section class="settings" aria-label="Display settings">
      <label class="setting" for="hourFormat">
        Clock format
        <select id="hourFormat">
          <option value="12">12-hour</option>
          <option value="24">24-hour</option>
        </select>
      </label>

      <label class="setting" for="showSeconds">
        Seconds
        <select id="showSeconds">
          <option value="yes">Show</option>
          <option value="no">Hide</option>
        </select>
      </label>

      <div class="shortcut-note">
        Shortcuts:
        <kbd>Space</kbd> start/pause ·
        <kbd>L</kbd> lap ·
        <kbd>R</kbd> reset
      </div>
    </section>
  </main>
</body>
</html>
